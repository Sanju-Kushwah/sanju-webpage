<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Html Multimedia</title>
  </head>
  <body>
    <h1>Html Multimedia -audio and video</h1>
    <h2>1. Simple audio</h2>
    <audio src="audio.ogg" controls></audio>
    <br><br>

    <h2>2. autoplay audio</h2>
    <audio src="audio.ogg" autoplay muted controls></audio>
    <br><br>

    <h2>3. Loop audio</h2>
    <audio src="audio.ogg" autoplay loop controls></audio>
    <br><br>

    <h2>4. Simple video</h2>
    <video src="video.mp4" controls height="200" width="400"></video>
    <br><br>

    <h2>5. Autoplay video</h2>
    <video
      src="video.mp4"
      autoplay
      muted
      controls
      height="200"
      width="400"
    ></video>
    <br><br>

    <h2>6. loop video</h2>
    <video
      src="video.mp4"
      autoplay
      loop
      controls
      height="200"
      width="400"
    ></video>
    <br><br>
  </body>
</html>
